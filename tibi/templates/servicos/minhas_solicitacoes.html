<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Solicitações</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #1a1a1a;
            color: #f8d210;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            background-color: #222;
            color: white;
            border: 1px solid #f8d210;
        }
        .btn-primary {
            background-color: #f8d210;
            border: none;
            color: #222;
        }
        .btn-primary:hover {
            background-color: #d9b10d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">Minhas Solicitações</h2>
        <div class="row">
            {% for solicitacao in solicitacoes %}
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Serviço: {{ solicitacao.servico.nome }}</h5>
                        <p class="card-text">Data: {{ solicitacao.data_solicitada }}</p>
                        <p class="card-text">Descrição: {{ solicitacao.descricao }}</p>
                        <p class="card-text">Status: {{ solicitacao.get_status_display }}</p>
                        <a href="#" class="btn btn-primary">Ver Detalhes</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <p class="text-center">Nenhuma solicitação encontrada.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
