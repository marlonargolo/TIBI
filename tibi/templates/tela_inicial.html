{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
    body {
        font-family: Arial, sans-serif;
        background: black;
    }
    .slider {
        position: relative;
        width: 100%;
        min-height: 70vh;
        overflow: hidden;
        margin-top: 80px;
    }
    .slides {
        display: flex;
        width: 100%;
        height: 100%;
    }
    .slide {
        min-width: 100%;
        height: 100vh;
        background-size: cover;
        background-position: center;
    }
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }
    .overlay a {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 20px;
        text-decoration: none;
        font-size: 1.5em;
        border-radius: 10px;
        position: relative;
    }
    .dialog-box {
        display: none;
        position: absolute;
        background: white;
        padding: 15px;
        border-radius: 10px;
        top: 100px;
        text-align: center;
        width: 200px;
    }
    .dialog-box button {
        margin-top: 20px;
        padding: 10px;
        background: #333;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .info-section {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(4, 150px);
        gap: 10px;
        padding: 20px;
    }
    .info-box {
        background: #e0bc00;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        border-radius: 25px;
        font-size: 1.2em;
        transition: transform 0.3s;
    }
    .info-box:hover {
        transform: scale(1.1);
    }
    @media (max-width: 768px) {
        .overlay {
            flex-direction: column;
        }
        .info-section {
            grid-template-columns: 1fr;
            grid-template-rows: repeat(8, 150px);
        }
    }
</style>

<div class="slider">
    <div class="slides">
        <div class="slide" style="background-image: url('{% static "images/cafe.jpeg" %}');"></div>
        <div class="slide" style="background-image: url('{% static "images/capa-2.jpg" %}');"></div>
        <div class="slide" style="background-image: url('{% static "images/capacete.jpg" %}');"></div>
        <div class="slide" style="background-image: url('{% static "images/images.jpeg" %}');"></div>
        <div class="slide" style="background-image: url('{% static "images/trabalhadores.jpeg" %}');"></div>
    </div>
    <div class="overlay">
        <a href="#" onclick="toggleDialog('cliente-dialog')">Quero contratar um serviço</a>
        <a href="#" onclick="toggleDialog('prestador-dialog')">Quero ser um prestador de serviço</a>
    </div>
</div>
<div id="cliente-dialog" class="dialog-box">
    <p>Já sou um cliente</p>
    <button onclick="window.location.href='{% url 'account_login' %}'">Entrar</button>
    <button onclick="window.location.href='{% url 'account_signup' %}'">Cadastro</button>
</div>

<div id="prestador-dialog" class="dialog-box">
    <p>Já sou um prestador</p>
    <button onclick="window.location.href='{% url 'account_login' %}'">Entrar</button>
    <button onclick="window.location.href='{% url 'account_signup' %}'">Cadastro</button>
</div>


<div class="info-section">
    <div class="info-box">Tibi</div>
    <div class="info-box">Franqueado e ADM</div>
    <div class="info-box">Redes Sociais</div>
    <div class="info-box">Quem Somos</div>
</div>

<script>
    function toggleDialog(id) {
        var dialog = document.getElementById(id);
        dialog.style.display = (dialog.style.display === 'block') ? 'none' : 'block';
    }
</script>
<script>
    let index = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;

    function nextSlide() {
        slides.forEach(slide => slide.style.display = 'none');
        slides[index].style.display = 'block';
        index = (index + 1) % totalSlides;
    }

    slides.forEach(slide => slide.style.display = 'none');
    slides[0].style.display = 'block';
    setInterval(nextSlide, 5000);
</script>

{% endblock %}
