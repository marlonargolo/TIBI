<!DOCTYPE html>
<html lang="pt">
<head>
    <title>Cadastro de Cliente</title>
</head>
<body>
    <h2>Cadastro de Cliente</h2>
    <form method="POST">
        {% csrf_token %}
        Nome Completo: <input type="text" name="nome" required><br>
        Cidade: <input type="text" name="cidade" required>
        Estado: <input type="text" name="estado" required><br>
        Bairro: <input type="text" name="bairro" required><br>
        Rua: <input type="text" name="rua" required><br>
        Número: <input type="text" name="numero" required><br>
        Complemento: <input type="text" name="complemento"><br>
        CPF / CNPJ: <input type="text" name="cpf_cnpj" required><br>
        Telefone (WhatsApp): <input type="text" name="telefone" required><br>
        Email: <input type="email" name="email" required><br>
        <input type="submit" value="Cadastrar">
    </form>
</body>
</html>
